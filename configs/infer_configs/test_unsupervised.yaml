BASE: ['']
TOOLBOX_MODE: "unsupervised_method"      # "train_and_test"  or "only_test" or "unsupervised_method"
UNSUPERVISED:
  METHOD: ["ICA", "POS", "CHROM", "GREEN", "LGI", "PBV", "OMIT"]
  METRICS: ['MAE', 'RMSE', 'MAPE', 'Pearson', 'SNR', 'BA']
  DATA:
    INFO:
      SKIN_COLOR: [1, 2, 3, 4] 
    FS: 50
    DATASET: test
    DO_PREPROCESS: True               # if first time, should be true
    DATA_FORMAT: NDHWC
    DATA_PATH: "/home/sophia/rPPG-Toolbox/data/test/RawData"          # need to be updated
    CACHED_PATH: "/home/sophia/rPPG-Toolbox/data/test/preprocessed"    # Processed dataset save path, need to be updated
    EXP_DATA_NAME: ""
    BEGIN: 0.0
    END: 1.0
    PREPROCESS:
      DATA_TYPE: ['Raw']
      DATA_AUG: ['None']    # 'None' or 'Motion' is supported, used if the data path points to an augmented dataset or requires augmentation
      LABEL_TYPE: Raw
      DO_CHUNK: False
      CHUNK_LENGTH: 180
      CROP_FACE:
        DO_CROP_FACE: True
        BACKEND: 'HC'    # HC for Haar Cascade, Y5F for YOLO5Face, MEDIAPIPE for MediaPipe Face Mesh
        USE_LARGE_FACE_BOX: False
        LARGE_BOX_COEF: 1.5
        REGION:
          MODE: 'RECTANGLE'             # RECTANGLE or POLYGON
          SOURCE: 'MEDIAPIPE_FACE'
          EXCLUDE_EYES: True
          EXCLUDE_MOUTH: True
        DETECTION:
          DO_DYNAMIC_DETECTION: True
          DYNAMIC_DETECTION_FREQUENCY : 25
          USE_MEDIAN_FACE_BOX: False    # This should be used ONLY if dynamic detection is used
        MEDIAPIPE:
          MAX_NUM_FACES: 1
          MODEL_PATH: './dataset/data_loader/face_detector/mediapipe/face_landmarker.task'
          MIN_DETECTION_CONFIDENCE: 0.5
          MIN_FACE_PRESENCE_CONFIDENCE: 0.5
          MIN_TRACKING_CONFIDENCE: 0.5
      RESIZE:
        H: 72
        W: 72
INFERENCE:
  EVALUATION_METHOD: "FFT"        # "FFT" or "peak detection"
  EVALUATION_WINDOW:
    USE_SMALLER_WINDOW: True        # Change this if you'd like an evaluation window smaller than the test video length
    WINDOW_SIZE: 15        # In seconds